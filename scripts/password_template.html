<!doctype html>
<html lang="ru" class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <title>/*[|template_title|]*/0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F4F0EA" />
    <link rel="icon" href="%%BASE%%favicon.svg" type="image/svg+xml" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <style>
      @font-face { font-family: 'Montserrat'; font-weight: 400; font-display: swap; src: url('%%BASE%%fonts/montserrat-cyrillic-400-normal.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: 'Montserrat'; font-weight: 400; font-display: swap; src: url('%%BASE%%fonts/montserrat-latin-400-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: 'Montserrat'; font-weight: 600; font-display: swap; src: url('%%BASE%%fonts/montserrat-cyrillic-600-normal.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: 'Montserrat'; font-weight: 600; font-display: swap; src: url('%%BASE%%fonts/montserrat-latin-600-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: 'Montserrat'; font-weight: 800; font-display: swap; src: url('%%BASE%%fonts/montserrat-cyrillic-800-normal.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: 'Montserrat'; font-weight: 800; font-display: swap; src: url('%%BASE%%fonts/montserrat-latin-800-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 500; font-display: swap; src: url('%%BASE%%fonts/jetbrains-mono-cyrillic-500-normal.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 500; font-display: swap; src: url('%%BASE%%fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #f4f0ea;
        color: #2f2b27;
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      .hidden { display: none !important; }

      .sc-loader { min-height: 100vh; display: grid; place-items: center; }
      .sc-loader i { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #e3b7ae; border-top-color: #8c5349; animation: sc-spin 0.9s linear infinite; }
      @keyframes sc-spin { to { transform: rotate(360deg); } }

      .sc-page { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px calc(32px + env(safe-area-inset-bottom, 0px)); overflow: hidden; }
      .sc-circle { position: absolute; width: min(70vw, 560px); aspect-ratio: 1; border-radius: 50%; background: #e3b7ae; right: -18%; top: -14%; }
      .sc-circle--2 { width: min(30vw, 220px); background: #f2e2dc; right: auto; left: -6%; top: auto; bottom: 8%; }

      .sc-card { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 36px 32px 30px; border-radius: 34px; background: #fff; box-shadow: 0 24px 60px rgba(47, 43, 39, 0.12); }
      .sc-brand { display: flex; align-items: baseline; gap: 10px; margin: 0 0 26px; }
      .sc-brand b { font-weight: 800; letter-spacing: -0.02em; }
      .sc-brand span { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 10.5px; letter-spacing: 0.18em; color: #8c5349; }
      .sc-eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #8c5349; }
      .sc-eyebrow::before { content: ''; width: 32px; height: 1.5px; background: currentColor; }
      .sc-title { margin: 0; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.035em; }
      .sc-text { margin: 14px 0 24px; color: #6b635b; font-size: 15.5px; }
      .sc-text a { color: #8c5349; font-weight: 600; text-underline-offset: 3px; }

      .sc-field { position: relative; }
      .sc-field input {
        width: 100%; height: 58px; padding: 0 56px 0 18px; border: 1.5px solid #e9e1d7; border-radius: 16px;
        background: #f4f0ea; font: 600 17px 'Montserrat', sans-serif; color: #2f2b27; outline: none; transition: border-color 0.2s, background-color 0.2s;
      }
      .sc-field input:focus { border-color: #8c5349; background: #fff; }
      .sc-field input[aria-invalid='true'] { border-color: #b4483a; }
      .sc-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border: 0; border-radius: 12px; background: transparent; display: grid; place-items: center; cursor: pointer; color: #6b635b; }
      .sc-eye:hover { color: #2f2b27; }
      .sc-eye svg { width: 22px; height: 22px; }
      .sc-error { margin: 10px 0 0; font-size: 14.5px; color: #a33d30; font-weight: 600; min-height: 1px; }

      .sc-remember { display: flex; align-items: center; gap: 12px; margin: 18px 0 22px; font-size: 15px; cursor: pointer; user-select: none; }
      .sc-remember input { width: 20px; height: 20px; margin: 0; accent-color: #8c5349; }

      .sc-btn { width: 100%; height: 58px; border: 0; border-radius: 18px; background: #2f2b27; color: #f4f0ea; font: 700 17px 'Montserrat', sans-serif; cursor: pointer; transition: transform 0.25s, box-shadow 0.25s; }
      .sc-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(47, 43, 39, 0.2); }
      .sc-back { display: inline-block; margin-top: 20px; font-size: 14.5px; color: #6b635b; }

      :focus-visible { outline: 3px solid #8c5349; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { .sc-loader i { animation-duration: 3s; } .sc-btn { transition: none; } }
      @media (max-width: 420px) { .sc-card { padding: 30px 22px 24px; border-radius: 28px; } .sc-title { font-size: 34px; } }
    </style>
  </head>

  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="sc-loader" aria-label="Загрузка"><i></i></div>

    <div id="staticrypt_content" class="hidden">
      <main class="sc-page">
        <span class="sc-circle" aria-hidden="true"></span>
        <span class="sc-circle sc-circle--2" aria-hidden="true"></span>
        <div class="sc-card">
          <p class="sc-brand"><b>Выйти из черновиков</b><span>SMM.CODE</span></p>
          <p class="sc-eyebrow">Личный кабинет</p>
          <h1 class="sc-title">Ваши уроки</h1>
          <p class="sc-text">
            Введите пароль, который прислал бот после оплаты. Потеряли — напишите в&nbsp;бот
            <a href="https://t.me/reporter_code_bot">@reporter_code_bot</a> или
            <a href="https://t.me/reginareporter">Регине в&nbsp;Telegram</a>.
          </p>

          <form id="staticrypt-form" action="#" method="post" novalidate>
            <div class="sc-field">
              <input id="staticrypt-password" aria-label="Пароль" type="password" name="password" placeholder="/*[|template_placeholder|]*/0" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="sc-error" />
              <button type="button" class="sc-eye" id="sc-eye" aria-label="/*[|template_toggle_show|]*/0" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p class="sc-error" id="sc-error" role="alert"></p>

            <label id="staticrypt-remember-label" class="sc-remember hidden">
              <input id="staticrypt-remember" type="checkbox" name="remember" checked />
              /*[|template_remember|]*/0
            </label>

            <button type="submit" class="sc-btn">/*[|template_button|]*/0</button>
          </form>
          <a class="sc-back" href="%%BASE%%">← О курсе</a>
        </div>
      </main>
    </div>

    <script>
      // заполняется StatiCrypt при генерации: формат '/*[|variable_name|]*/0'
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0",
        templateToggleAltShow = "/*[|template_toggle_show|]*/0",
        templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: 'staticrypt_expiration',
        rememberPassphraseKey: 'staticrypt_passphrase',
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (!isSuccessful) {
          document.getElementById('staticrypt_loading').classList.add('hidden');
          document.getElementById('staticrypt_content').classList.remove('hidden');
          document.getElementById('staticrypt-password').focus();
          if (isRememberEnabled) document.getElementById('staticrypt-remember-label').classList.remove('hidden');
        }
      };

      const eye = document.getElementById('sc-eye');
      const input = document.getElementById('staticrypt-password');
      const errorEl = document.getElementById('sc-error');
      eye.addEventListener('click', function () {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        eye.setAttribute('aria-pressed', String(show));
        eye.setAttribute('aria-label', show ? templateToggleAltHide : templateToggleAltShow);
      });
      input.addEventListener('input', function () {
        errorEl.textContent = '';
        input.removeAttribute('aria-invalid');
      });

      document.getElementById('staticrypt-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const password = input.value.trim(),
          isRememberChecked = document.getElementById('staticrypt-remember').checked;
        if (!password) {
          errorEl.textContent = 'Введите пароль из сообщения бота.';
          input.setAttribute('aria-invalid', 'true');
          return;
        }
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
        if (!isSuccessful) {
          errorEl.textContent = templateError;
          input.setAttribute('aria-invalid', 'true');
          input.select();
        }
      });
    </script>
  </body>
</html>
